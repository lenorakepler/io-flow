# Node type declarations -- io-flow's built-in types, and the shape yours take.
#
# A project's own `templates/types.yaml` is merged over this one, entry by
# entry: name a type here to add it, or reuse a name to replace that entry. Types
# you never declare still work -- they render a bare title, take a
# `.node--<type>` CSS class, and get the generic sidebar.
#
# Every field is Jinja source, rendered with the node's own `label`, `id`,
# `type`, `data`, `fields` (data minus type/label and relation blocks),
# `classes` and `parent`. Markup in the field is markup; `{{ values }}` are
# escaped.
#
#   extends:  another type -- inherits its fields, its template and its CSS
#             class, so .node--<parent> rules apply and .node--<child> rules
#             override. `node` and `group` are ordinary types; extend them too.
#             Omit it and a node with children renders through group.html
#             anyway -- structure is inferred, the group *look* is not.
#   class:    extra CSS classes, without inheriting anything else
#   css:      rules for this type, emitted as `.node--<type> { ... }`
#   title:    the node's name line              (default: "{{ label }}")
#   badge:    the pill beside the title         (omit for no badge)
#   meta:     dimmer lines under the title; a line rendering blank is dropped,
#             which is how "show `cli` only if there is one" works
#   blocks:   {name: jinja} replacing a base's block outright ({{ super() }} works)
#   template: a whole template written inline here -- it owns the wrapper
#             element like a file does, and may {% extends "node.html" %}
#   sidebar:  inline Jinja for the detail panel, instead of the generic dump
#
# Anything too big for a line goes in `templates/<type>.html.j2`, which wins
# over its declaration here.

file:
  badge: file
  meta:
    - "{% if data.cli %}<code>{{ data.cli }}</code>{% endif %}"
    - "{{ data.value }}"

option:
  badge: option
  meta:
    - "{% if data.cli %}<code>{{ data.cli }}</code>{% endif %}"

parameter:
  badge: param
  meta:
    - "{% if data.value is defined %}= {{ data.value }}{% endif %}"

# Callables mark themselves with () rather than a badge.
function:
  title: "{{ label }}()"
  meta:
    - "{{ data.loc }}"

method:
  title: "{{ label }}()"

# Attribute bags: the wiring lives in the node's args: map; fall back to plain
# data keys for bags declared without edges.
attributes:
  title: attributes
  meta:
    - "{{ (data.args or data) | reject('in', ['type', 'label']) | join(', ') }}"
  sidebar: "<dl><dt>attributes</dt><dd>{% for k in (data.args or data) if k not in ['type', 'label'] %}<div><code>{{ k }}</code></div>{% endfor %}</dd></dl>"

# Containers: `_group` is `_node` plus the children mount. Compound-ness is a
# state, not a type -- any node with children gets a mount either way -- but
# declaring _group makes it explicit, and its CSS gives it a real header bar.
class:
  extends: group          # same container structure, its own accent on top
  meta:
    - "{{ data.loc }}"

# `group.html` is the template for a node that holds children; every node with
# children renders through it whether or not it says so. Declaring
# `extends: group` is how a type asks for the group *look* as well.
group: {}

node: {}
