[project]
name = "io-flow"
version = "0.1.0"
description = "YAML -> interactive, single-file HTML dependency/dataflow diagrams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18",
    "jinja2>=3",
]

[project.scripts]
io-flow = "io_flow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already carries assets/ (data files included, not just .py), so a
# force-include of the same tree double-adds every file and hatchling errors.
packages = ["src/io_flow"]
